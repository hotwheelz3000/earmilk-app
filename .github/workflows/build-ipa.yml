name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The app name comes from `product:` in xtool.yml; the version from
      # CFBundleShortVersionString in the Info.plist named by `infoPath:`.
      - name: Read app name and version
        id: app
        run: |
          name=$(awk -F': *' '$1 == "product" { print $2 }' xtool.yml | tr -d "\"' \r")
          if [ -z "$name" ]; then
            echo "::error::xtool.yml has no 'product:' entry"
            exit 1
          fi
          plist=$(awk -F': *' '$1 == "infoPath" { print $2 }' xtool.yml | tr -d "\"' \r")
          version=$(plutil -extract CFBundleShortVersionString raw "$plist" 2>/dev/null || echo "")
          echo "App: $name ${version:-(no version)}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Per https://xtool.sh/documentation/xtooldocs/installation-macos:
      # use the preinstalled Xcode for the iOS SDK + Swift toolchain, then
      # install xtool via Homebrew. No `xtool setup` / Apple ID is needed for
      # an unsigned build.
      - name: Check Xcode toolchain
        run: |
          xcode-select -p
          xcrun -sdk iphoneos -show-sdk-path
          swift --version

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --help

      # Builds for arm64-apple-ios (the default triple). Without --sign the
      # app is left unsigned; --ipa zips it into Payload/ as xtool/<App>.ipa.
      # Compiler errors are also reported as annotations, so they show up on the
      # run's summary page without opening the full log.
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          if ! xtool dev build --ipa 2>&1 | tee build.log; then
            grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Package IPA manually if needed
        env:
          APP_NAME: ${{ steps.app.outputs.name }}
        run: |
          if [ ! -f "xtool/$APP_NAME.ipa" ]; then
            echo "xtool did not produce an .ipa; packaging the .app manually"
            rm -rf Payload
            mkdir Payload
            cp -R "xtool/$APP_NAME.app" Payload/
            zip -r "xtool/$APP_NAME.ipa" Payload
          fi
          ls -la xtool

      # Every build of main is published as the "latest" GitHub Release, which holds
      # the plain IPA (named with the version, e.g. Earmilk-1.0.ipa). The title
      # carries the version; the notes come from RELEASE_NOTES.md plus the build time.
      # A release left as a draft is published at the end, so the link always works.
      - name: Publish as latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ steps.app.outputs.name }}
          version: ${{ steps.app.outputs.version }}
        run: |
          file="$APP_NAME${version:+-$version}.ipa"
          cp "xtool/$APP_NAME.ipa" "xtool/$file"
          label=$(TZ=America/Los_Angeles date '+%b %-d, %Y %-I:%M %p')
          {
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; echo; fi
            echo "Built from ${GITHUB_SHA::7} on $label (Los Angeles time). Download $file below."
          } > release-notes.txt
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "xtool/$file" \
            --title "$APP_NAME${version:+ $version}" \
            --notes-file release-notes.txt \
            --latest
          gh release edit latest --draft=false
